<template>
  <lightning-card title="Token Actions" icon-name="utility:key">
    <div class="slds-p-around_medium">
      <div class="slds-grid slds-wrap slds-gutters">
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
          <lightning-input
            label="Scope"
            value={scope}
            onchange={handleScopeChange}
            placeholder="e.g. read:all"
            data-id="scope-input"
          ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
          <lightning-input
            type="date"
            label="Expiry Date"
            value={expiryDate}
            onchange={handleExpiryChange}
            data-id="expiry-input"
          ></lightning-input>
        </div>
      </div>
      <div class="slds-m-top_medium">
        <lightning-button
          label="Issue Token"
          variant="brand"
          onclick={handleIssueToken}
          class="slds-m-right_small"
          data-id="issue-btn"
        ></lightning-button>
        <lightning-button
          label="Revoke Token"
          variant="destructive"
          onclick={handleRevokeToken}
          disabled={isRevokeDisabled}
          data-id="revoke-btn"
        ></lightning-button>
      </div>
    </div>
  </lightning-card>
</template>
